[project]
name = "set-solver"
version = "0.1.0"
description = "OpenCV-based SET board solver."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "opencv-python>=4.13.0",
  "Pillow>=12.2.0",
  "scipy>=1.17.1",
  "tqdm>=4.68.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
